services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: collector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network Postgres is reached by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://collector:collector@db:5432/collector
    ports:
      - "8000:8000"
    volumes:
      # `collector export` writes here; files appear in ./exports on the host.
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Public HTTPS tunnel to the app, for Meta's OAuth redirect and webhooks during
  # development. Needs NGROK_AUTHTOKEN and NGROK_DOMAIN in .env (see README). Without
  # them only this container exits; the rest of the stack runs normally.
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "--url=${NGROK_DOMAIN:-}", "app:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"  # ngrok inspector: see every request Meta sends
    depends_on:
      - app

volumes:
  pgdata:
