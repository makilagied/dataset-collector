services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
      POSTGRES_DB: collector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # Inside the compose network Postgres is reached by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://collector:collector@db:5432/collector
    ports:
      - "8000:8000"
    volumes:
      # `collector export` writes here; files appear in ./exports on the host.
      - ./exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
