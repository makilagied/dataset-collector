# Words that point an insult at the reader. A context_dependent root counts as a hit only
# when one of these is within two tokens of it.
second_person_cues:
  words: [wewe, we, wee, nyinyi, ninyi, nyie, u]
  # 2nd-person singular verb forms: unakula, umekuwa, utakufa, ulikuwa
  pattern: "^u(na|me|ta|li)[a-z]{2,}"
