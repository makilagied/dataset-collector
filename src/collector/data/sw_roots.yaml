# Seed lexicon of abusive Swahili roots.
#
# TODO(native speakers): THIS IS A SMALL SEED LIST, NOT A REVIEWED LEXICON. Please review
# every entry (meaning, severity, prefixes), add missing roots and regional variants,
# and decide whether Kenyan Sheng is in scope (entries marked "sheng" in notes).
#
# Fields
#   root               the stem, lowercase, as it appears after normalization
#   prefixes           allowed noun-class prefixes; "" means the bare root is also a match.
#                      Omit "" when the bare root is an innocent word (shamba = farm).
#   severity           low | medium | high
#   context_dependent  true for words that are only abusive when aimed at someone
#                      (animal words). These count as hits only next to a 2nd-person cue.
#   verb               true for verbs, written in dictionary form ending in "a" (tomba).
#                      Any subject/tense/object prefixes may precede it (nitakutomba) and
#                      the final "a" may become a verb ending (tombe, tombwa, tombana).
#                      `suffixes` overrides the endings; `prefixes` is not allowed.
#   notes              free text for reviewers

roots:
  - {root: jinga, prefixes: [m, wa, u, ki, ma], severity: medium, context_dependent: false,
     notes: "fool / foolishness (mjinga, wajinga, ujinga)"}
  - {root: pumbavu, prefixes: [m, wa, u, ki], severity: medium, context_dependent: false,
     notes: "idiot (mpumbavu, upumbavu)"}
  - {root: shenzi, prefixes: [m, wa, u, ki], severity: medium, context_dependent: false,
     notes: "savage / uncivilised (mshenzi, ushenzi)"}
  - {root: bwege, prefixes: ["", ma], severity: medium, context_dependent: false,
     notes: "fool"}
  - {root: zuzu, prefixes: ["", ma], severity: medium, context_dependent: false,
     notes: "fool"}
  - {root: fala, prefixes: ["", ma], severity: medium, context_dependent: false,
     notes: "fool (sheng / Kenyan)"}
  - {root: boya, prefixes: ["", ma], severity: medium, context_dependent: true,
     notes: "fool (sheng); also 'buoy'"}
  - {root: lofa, prefixes: ["", ma], severity: low, context_dependent: false,
     notes: "vagrant / good-for-nothing"}
  - {root: shamba, prefixes: [m, wa], severity: low, context_dependent: false,
     notes: "'bumpkin' (mshamba); bare 'shamba' = farm, so no bare match"}
  - {root: malaya, prefixes: ["", u], severity: high, context_dependent: false,
     notes: "prostitute (slur)"}
  - {root: kahaba, prefixes: ["", ma, u], severity: high, context_dependent: false,
     notes: "prostitute (slur)"}
  - {root: senge, prefixes: [m, wa, u], severity: high, context_dependent: false,
     notes: "homophobic slur"}
  - {root: shoga, prefixes: ["", ma, u], severity: high, context_dependent: true,
     notes: "homophobic slur; on the coast also 'female friend'"}
  - {root: kuma, prefixes: [""], severity: high, context_dependent: false,
     notes: "vulgar (genitals)"}
  - {root: kumama, prefixes: [""], suffixes: [ko, ke, yako, yake, ye, enu], severity: high,
     context_dependent: false,
     notes: "vulgar insult directed at someone's mother (kumamako, kumamake: his/her mother's)"}
  - {root: mamae, prefixes: [""], severity: high, context_dependent: false, fuzzy: false,
     notes: "insult at someone's mother (MAMAEE). No typo matching: 'mama', 'mamake' are innocent"}
  - {root: kundu, prefixes: [m, mi], severity: high, context_dependent: false,
     notes: "vulgar (anus) - mkundu"}
  - {root: tako, prefixes: [ma], severity: medium, context_dependent: false,
     notes: "vulgar (buttocks) - matako"}
  - {root: mavi, prefixes: [""], severity: medium, context_dependent: false,
     notes: "excrement"}
  - {root: nyesi, prefixes: [ki, vi], severity: medium, context_dependent: false,
     notes: "excrement (kinyesi)"}
  - {root: mbwa, prefixes: [""], severity: medium, context_dependent: true,
     notes: "dog"}
  - {root: nyani, prefixes: [""], severity: medium, context_dependent: true,
     notes: "baboon"}
  - {root: punda, prefixes: [""], severity: medium, context_dependent: true,
     notes: "donkey"}
  - {root: nguruwe, prefixes: [""], severity: medium, context_dependent: true,
     notes: "pig"}
  - {root: kenge, prefixes: [""], severity: medium, context_dependent: true,
     notes: "monitor lizard; 'idiot'"}
  - {root: ngedere, prefixes: [""], severity: medium, context_dependent: true,
     notes: "monkey"}
  - {root: mbuzi, prefixes: [""], severity: low, context_dependent: true,
     notes: "goat"}
  - {root: fisi, prefixes: [""], severity: low, context_dependent: true,
     notes: "hyena; 'greedy person'"}
  - {root: takataka, prefixes: [""], severity: medium, context_dependent: true,
     notes: "rubbish"}

  # Vulgar verbs (added 2026-10-15).
  - {root: tomba, verb: true, severity: high, context_dependent: false,
     notes: "vulgar: to fuck (kutomba, nitakutomba, tombwa)"}
  - {root: fira, verb: true, suffixes: [a, wa, ana, ewa], severity: high,
     context_dependent: false,
     notes: "vulgar: to sodomise (kufira, firwa). No -e ending: 'fire' is English"}
  - {root: fila, verb: true, suffixes: [a, wa, ana, ewa], severity: high,
     context_dependent: false,
     notes: "l/r spelling of fira (kufila, filwa). No -e ending: 'file' is English"}
  - {root: gonga, verb: true, severity: medium, context_dependent: true,
     notes: "slang: to have sex with; usually 'hit / knock' (gonga mlango, amegongwa na
       gari), so only a hit next to a 2nd-person cue"}

