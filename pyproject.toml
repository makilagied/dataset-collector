[project]
name = "ig-abuse-dataset"
version = "0.1.0"
description = "Swahili abusive-comment dataset collector (Instagram official API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "tenacity>=9.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "rapidfuzz>=3.9",
  "cryptography>=43.0",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Large (~170 MB) wheel; only needed for language ID in the processing pipeline (M8).
nlp = ["lingua-language-detector>=2.0"]
dev =["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[project.scripts]
collector = "collector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
